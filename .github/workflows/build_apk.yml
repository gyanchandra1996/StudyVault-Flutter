name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.6.0
          name: "Medhavi (मेधावी) Flutter v2.6.0 - PIN Auth, DigiLocker 5-Tab Dock, Study & Quiz Separation, ID Vault & Brain Games"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.6.0 Official Release APK
            - **1. Simplified PIN Registration & Login**: Name & 4-digit PIN only (default 1996), Master PIN `1996` always unlocks.
            - **2. Accidental Logout Protection**: Direct PIN Login Screen to instantly unlock your profile.
            - **3. DigiLocker 5-Item Navigation Dock**: Home | Study | AI Tutor (curved floating pill) | Quizzes | Vault.
            - **4. Study & Quiz Hub Separation**: Dedicated Quizzes screen with past tests, mistake bank, question pool, CSV import & AI Quiz creator.
            - **5. Category Hierarchy Clean Design**: Borderless tree view with Rename category & subcategory support.
            - **6. DigiLocker ID Vault**: Fixed layout overflow, added Royal Blue DigiLocker header with offline encrypted sandbox.
            - **7. Spaced Memory Flashcards**: Enhanced 3D cards, instant shuffle mode, and pre-seeded high-yield decks.
            - **8. 6-in-1 Brain Games**: Speed Math Blitz, Schulte Grid, Memory Match, Stroop Reflex, Word Scramble & Number Sequence logic.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
