name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.7.0
          name: "StudyVault Flutter v1.7.0 (Dynamic AI Toggle, Gemini 1.5/2.0 API Fix, Smart Offline Quiz, Redesigned Quiz UI & Modern Card System)"
          body: |
            ### 📱 StudyVault Flutter v1.7.0 Official Release APK
            - **1. Settings-Controlled Dynamic AI Visibility**: All AI features (AI Tutor Q&A, AI Notes to PDF, AI Flashcards, AI Quiz) are now strictly visible only when enabled in Settings. Disabling AI completely cleans the UI of AI triggers.
            - **2. Fixed Google Gemini API & Multi-Model Engine**: Resolved 404 endpoint failures by migrating to official Gemini 1.5 Flash, 2.0 Flash, and 1.5 Pro with automatic fallback cascade.
            - **3. Smart 1-Tap Offline Question Bank Generator**: Instant practice quiz generation covering Indian Polity, Modern History, Geography, General Science, Aptitude, Reasoning, and Hindi Vyakaran without requiring internet or API key.
            - **4. Redesigned Modern Quiz & Question Creation UI**: Rebuilt `AiQuizModal` and `QuestionModal` with gradient accents, topic suggestion chips, marking pattern chips (+1/-0.25, +2/-0.66, etc.), custom question counts, and quick key configuration.
            - **5. Enhanced Card Aesthetics Across All Pages**: Upgraded elevation, rounded corners, soft shadows, and border accents on Dashboard, Categories, Category Detail, Notes, and Document Vault.
            - **6. 1-Click SQLite Backup & Exam Preparation Suite**: Includes negative marking, mistake notebook, PDF tools, target exam countdown, and spaced repetition flashcards.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
