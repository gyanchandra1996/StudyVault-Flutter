name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "StudyVault Flutter v1.5.0 (AI Assistant, Custom Quiz Timer, Category Bank, PDF Tools Suite, Smooth PDF)"
          body: |
            ### 📱 StudyVault Flutter v1.5.0 Release APK
            - **1. General AI Study Q&A Assistant**: Full conversational AI study tutor with quick prompt chips, markdown explanations, copy button, and save to notes / flashcards
            - **2. Custom Number of Questions**: Choose presets (3, 5, 10, 15, 20, 25, 30, All) or enter custom question count in quizzes and AI generation
            - **3. Category-Wise Question Bank**: Filter question bank by category with horizontal chips, subject count badges, and category labels on every question card
            - **4. Eliminated Dashboard Duplicate**: Removed duplicate display of currently reading document from recent materials carousel
            - **5. Compact Recent Quiz Performance Cards**: 50% height reduction for recent quiz performance cards on dashboard tab for optimal space efficiency
            - **6. AI Flashcards Generator**: Generate spaced-repetition flashcard decks with AI, with batch count configured from Settings (3, 5, 10, 15, 20)
            - **7. AI PDF Notes Generator**: Generate structured study notes and export directly into real multi-page PDF documents stored in your vault
            - **8. Complete PDF Tools Suite**: Image to PDF, Merge Multiple PDFs, Edit & Trim PDF Pages, and PDF to Image View
            - **9. Smooth Flicker-Free PDF Reader**: Eliminated screen flicker during scroll with RepaintBoundary, continuous layout mode, and conditional hardware rendering
            - **10. Guided App Walkthrough (Intro.js Style)**: Interactive spotlight walkthrough on first app install with replay option from Settings
            - **11. Quiz Duration & Countdown Timers**: Configurable timer (5m, 10m, 15m, 20m, 30m, 45m, 60m, custom minutes) with live countdown and auto-submit on timeout
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
