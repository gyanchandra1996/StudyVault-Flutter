name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.6.0
          name: "StudyVault Flutter v1.6.0 (Negative Marking, Mistake Notebook, Question Search, PDF Compressor, 1-Click Backup & Restore, Exam Countdown)"
          body: |
            ### 📱 StudyVault Flutter v1.6.0 Ultimate Release APK
            - **1. Negative Marking & Realistic Exam Patterns**: Configurable penalty deduction (SSC/Banking -0.25, UPSC/BPSC -0.66, Railway -0.33) with full scorecard penalty breakdowns.
            - **2. Weak Area / Mistake Notebook**: Automatically tracks incorrect quiz questions with 1-tap "Revise Mistakes Only" test runner directly from the Quizzes tab.
            - **3. Instant Question Bank Search Bar**: Real-time keyword search across question stems, options, and explanations with instant highlighting.
            - **4. PDF Compressor Tool**: Compress and optimize large textbook PDFs directly inside the app with best-stream compression.
            - **5. 1-Click SQLite & Study Data Backup & Restore**: Export all questions, notes, flashcards, bookmarks, and quiz history into a portable JSON backup file, with 1-tap restore.
            - **6. Target Exam Countdown Widget**: Live countdown banner on dashboard tracking remaining days until exam with motivational preparation phases.
            - **7. General AI Study Q&A Assistant**: Full conversational AI study tutor with quick prompt chips, markdown explanations, copy button, and save to notes / flashcards.
            - **8. Custom Number of Questions & Timers**: Choose presets or enter custom question count & duration countdown for mock exams.
            - **9. Category-Wise Question Bank**: Filter question bank by category with horizontal chips and subject badges.
            - **10. Eliminated Dashboard Duplicate**: Removed duplicate display of currently reading document from recent materials carousel.
            - **11. Compact Recent Quiz Performance Cards**: 50% height reduction for recent quiz performance cards on dashboard tab.
            - **12. AI Flashcards & PDF Notes Generator**: Generate spaced-repetition flashcards and draft structured PDF study notes.
            - **13. Smooth Flicker-Free PDF Reader & Full PDF Tools Suite**: Continuous layout mode with Image to PDF, Merge, and Page Trimming tools.
            - **14. Guided App Walkthrough**: Interactive intro tour for first-time users with replay option.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
