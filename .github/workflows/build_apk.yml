name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.0
          name: "Medhavi (मेधावी) Flutter v2.9.0 - Full Sepia PDF Reader, Formatted Aarna AI, Interactive Revision Handbook, E-Book Library & Master Excel Import"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.9.0 Official Release APK
            - **1. Full Sepia & Night PDF Chrome**: Extended Sepia Paper (and Night Mode) styling to the PDF reader top AppBar, search bar, status/navigation bars, page canvas, and bottom toolbar.
            - **2. Formatted Aarna AI Responses**: Added native rich-text `FormattedAiText` rendering (headings, bold/italic, inline/fenced code blocks, blockquotes, bullet/numbered lists, and styled tables) in Aarna AI Chat and AI Notes preview.
            - **3. Interactive Exam Revision & Handbook on Home**: Replaced Home's Digital Sign tile with Exam Revision & Handbook (`ExamRevisionSpotlightCard` with subject chips, active-recall reveal cards, and revised progress) plus upgraded `QuickRevisionHandbookModal` with Flash Recall Mode, progress tracking, bookmarks, TTS listening, and `+ Flashcard`.
            - **4. E-Book Library & Reader in Exam & Utility Hub**: Added a dedicated E-Book shelf supporting PDF E-Books, single-image E-Books, and multi-page image E-Books with zoom, Sepia/Night eye-care modes, progress sync, and edit/delete master controls.
            - **5. Master Excel Data Import in Settings**: Added pure-Dart `.xlsx` & `.csv` Master Import (`MasterExcelService` & `MasterExcelImportModal`) to bulk-import Handbook formulas, Quizzes, Flashcards, Categories/Subfolders, and Notes together, plus `.xlsx` template & current-data export.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
