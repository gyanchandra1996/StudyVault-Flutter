name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.1
          name: "Medhavi (मेधावी) Flutter v2.9.1 - Smoothness Polish, Interactive Weekly Line Chart, Scoped Rebuilds & All-Screen Audit"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.9.1 Official Release APK
            - **1. App-Wide Smoothness & Performance**: Added lazy tab initialization in `MainScreen` (`_visitedTabs`) with smooth animated active indicators, global `BouncingScrollPhysics` scroll behavior, deduplicated concurrent `StudyProvider.loadInitialData()` startup loads, and scoped `Selector`/`Consumer` rebuilds in `DigiHomeScreen` and `UtilityHubScreen`.
            - **2. Home Weekly Line Chart Upgrades**: Batched `ReadingRepo.getWeeklyActivity()` into a single `GROUP BY` query, added `ReadingRepo.changes` live refresh after reading sessions finish saving, added tap-to-inspect day tooltips, smooth animated line drawing, dynamic Y-axis padding, and clamped edge labels.
            - **3. Bug Fixes & Verification**: Wired searchable Question Pool in `QuizHubScreen`, enforced target KB size limits in `ToolsHubScreen` Image Resizer, removed blocking `File.existsSync()` in Home avatar build, improved dark-mode contrast, and added automated widget & service tests (`flutter test`).
            - **4. All v2.9.0 Features Preserved**: Full Sepia/Night PDF bars, rich formatted Aarna AI output, interactive Exam Revision & Handbook, E-Book PDF/Image library, and Master Excel (`.xlsx`/`.csv`) import.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
