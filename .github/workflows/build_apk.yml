name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.7.0
          name: "Medhavi (मेधावी) Flutter v2.7.0 - Aarna AI, Anti-Flicker, Pomodoro Presets, Tic-Tac-Toe & Decision Spinner"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.7.0 Official Release APK
            - **1. Rebranded to Aarna (Master AI)**: Renamed Master AI to Aarna AI everywhere across Home, Study Hub, and Settings.
            - **2. Flicker & Jitter Elimination**: Fixed root startup initialization flicker, converted full-screen rebuilding timers to scoped consumers, eliminated build-phase state mutations, and cached typography.
            - **3. Exam Utility Tools Suite (1 Row 3 Cards & Proper Scaffold)**: Wrapped the utility tools suite in a proper Scaffold with royal Medhavi AppBar, back navigation, and consistent 3-column square card grid.
            - **4. Authentic DigiLocker ID Vault**: Replaced breaking card design with official DigiLocker credential card style featuring credential numbers, view & share actions, and toggles between 3-column grid and list view.
            - **5. Interactive Candidate Profile & Photo Upload**: Tap avatar or greeting to view security PIN info, change name, upload/change profile photo directly from camera, gallery, or device files, and logout.
            - **6. Pomodoro Focus Timer Settings Sheet**: Added quick presets (Standard 25/5, Deep Focus 45/10, Power Session 50/10, Marathon 60/15, Quick Sprint 15/3) and custom sliders (5-120 min study, 1-45 min break) with persistent storage and trigger buttons on Home bar, Utility Suite, and PiP overlay.
            - **7. 10-in-1 Cognitive Brain Training Games**: Added **Tic-Tac-Toe** (tactical 3×3 strategy vs Aarna AI or local 2-Player mode) and **Study Decision Spinner Wheel** (physics-based animated spinner for revision topics, break activities, and rapid challenges).
            - **8. Registration & Login Redesign**: Clean Medhavi header and simplified student login interface.
            - **9. Flashcards & Zero Divider Hierarchy**: Glowing mastery flashcards and removed unwanted horizontal divider lines across subjects and subtopics.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
