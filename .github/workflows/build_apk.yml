name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.4
          name: "StudyVault Flutter v1.3.4 (Interactive Quiz Names, Live Timer, Scorecard & Re-attempt)"
          body: |
            ### 📱 StudyVault Flutter v1.3.4 Release APK
            - **Custom Quiz Name / Assessment Title**: Name your assessments or use AI-generated titles (e.g., "DBMS Normalization Test", "Reasoning Mock 1")
            - **Live Quiz Timer & Duration**: Live stopwatch during the assessment and total completion time recorded upon submission
            - **Comprehensive Assessment Scorecard**: Rich score report with percentage, letter grade, accuracy, time taken, and question-by-question breakdown with explanations
            - **100% Local DB Offline Persistence**: Every quiz session, questions, and your selected answers are saved in SQLite to review anytime offline
            - **Instant Re-attempt Quiz**: 1-Tap re-attempt button on the Scorecard and Recent Quiz History to retake any test
            - **Verified Live Working Gemini 3.5 Flash**: Pre-loaded 100% Free AI generation
            - **Zero Scroll Flicker**: 1500px pre-caching and persistent client mixins
            - **Developed by Gyanchandra**: Prominent developer credits and badges
            - **Pre-Seeded Core Categories**: CS & IT, Quantitative Aptitude, Reasoning, GK & Current Affairs, English, Hindi Vyakaran
            - **Dedicated Categories Bottom Tab**: Instant search and exam filtering
            - **App Security & 4-Digit PIN Lock**: Keypad lock protecting study materials
            - **Direct PDF Sharing**: Native zero-dependency FileProvider sharing to WhatsApp, Drive, etc.
            - **Native Google Pdfium Indic Rendering Engine**: 100% Hindi/Devanagari text clarity without tofu boxes `□`
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
