name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          cat analyze.log
          echo "### Flutter Analyze Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat analyze.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Build Standalone Release APK
        run: |
          flutter build apk --release --no-tree-shake-icons > build.log 2>&1 || (cat build.log && echo "### Build Error" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && cat build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "StudyVault Flutter v1.2.0 (PIN Lock, Categories Tab & PDF Share)"
          body: |
            ### 📱 StudyVault Flutter v1.2.0 Release APK
            - **Butter-Smooth UI (Zero Flickering)** with permanent state preservation
            - **Pre-Seeded Core Categories**: Computer Science, Arithmetic, Reasoning, GK, English, Hindi Vyakaran
            - **Dedicated Categories Bottom Tab** with instant search & exam filtering
            - **App Security & 4-Digit PIN Lock** to protect study materials and notes
            - **Direct PDF Sharing** to WhatsApp, Google Drive, and other apps
            - **Reading Streak Tracker (🔥)** with Daily & Weekly Activity Charts
            - **Eye-Care Reading Modes**: Day, Sepia Warm Paper, and AMOLED Pure Black
            - **100% Native Google Pdfium Indic Rendering Engine** (No Tofu Boxes `□`)
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
