name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.2.0
          name: "Medhavi (मेधावी) Flutter v2.2.0 - Excel/CSV Question Importer, Dynamic Syllabus Categories & Handbook Custom Tabs"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.2.0 Official Release APK
            - **1. Excel / CSV Question Bank Importer (Category-Wise)**:
              - Bulk import MCQs directly from Excel (.csv / .tsv / .txt) files into your Question Bank.
              - Auto-detection mode: automatically reads and maps questions to categories from the Excel 'Category' column.
              - Targeted assignment mode: assign all imported questions to any existing or custom category.
              - In-app file parser with duplicate detection, skipped row reporting, and instant database ingestion.
            - **2. Sample Excel Template (.csv) Downloader & Previewer**:
              - 1-Click "Download Sample .csv" to open and edit directly in Microsoft Excel, Google Sheets, or WPS Office.
              - Built-in "Preview Table" modal showing column headers (`Question, Option A, Option B, Option C, Option D, Correct Option, Explanation, Category`).
              - "Copy CSV to Clipboard" button to quickly create questions on mobile or PC.
            - **3. Dynamic Syllabus Tracker with Custom Categories & Exams**:
              - Add custom subjects / categories to any exam (e.g. "General Science & Tech", "Indian Economy", "Ethics") with persistent SharedPreferences storage.
              - Add custom topics to any subject card with 1 tap.
              - Create brand new Exam Tracks (e.g. "State PSC", "Railway RRB", "CTET / Teaching") with custom syllabus checklists.
              - Delete and manage custom syllabus items anytime.
            - **4. Dynamic Quick Revision Handbook with Custom Tabs**:
              - Add custom subjects / tabs to the handbook (e.g. "Economics & Budget", "Current Affairs", "Computer Aptitude").
              - Add revision notes, formulas, and key facts to any tab with persistent storage.
              - Full real-time search across both default and custom revision tabs.
            - **5. Unbreakable Quiz Engine with Auto-Failover & Model Sanitization**:
              - All fixes from v2.1.0 including 8192-token capacity, 20-question padding, and seamless offline failover.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
