name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.6.3
          name: "Medhavi (मेधावी) Flutter v2.6.3 - DigiLocker Utility Suite, Master AI, Settings Tab & Profile Photo"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.6.3 Official Release APK
            - **1. Rebranded to Medhavi (मेधावी)**: Clean Indic exam & study vault branding; completely eliminated all legacy "Digi" branding from the Home page.
            - **2. Home Top Header Master AI Control**: Replaced view-only pill with the glowing Master AI Control button (`AI: ON` / `AI: OFF`), while View Only/Edit mode toggle is neatly housed in Settings.
            - **3. Settings Bottom Navigation Tab**: Tab 4 is now Settings (`Icons.settings_rounded`) preserving ALL settings (Safe study mode, PIN security, multi-AI agents, theme, backup/restore, storage, recycle bin).
            - **4. Interactive Candidate Profile & Photo Upload**: Click on avatar or candidate greeting to view security PIN info, change name, upload/change profile photo, and logout.
            - **5. DigiLocker 3-Column Square Cards for Exam Utility Tools**: Authentic DigiLocker category grid matching official app screenshots with soft pastel icon containers, 2-line centered labels, and zero layout overflows.
            - **6. DigiLocker ID Vault Redesign**: Fixed breaking card design; implemented official DigiLocker credential card style with ID number, issuing authority label, share, delete, and view actions.
            - **7. Category Hierarchy Line Removal**: Removed unwanted horizontal divider lines across subjects and subtopics in Study & Quiz Center.
            - **8. Full Rename Functionality**: Rename subjects and subfolders directly with edit dialog from Study Center and Category Detail screens.
            - **9. Attractive Flashcards Redesign**: Dual-sided glowing cards, mastery level indicators, Leitner box badges, and 3D flip cues.
            - **10. 8-in-1 Cognitive Brain Games**: Added **Spatial Pattern Matrix** (non-verbal reasoning) and **Odd-One-Out Blitz** (speed concept classification) to the brain training hub.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
