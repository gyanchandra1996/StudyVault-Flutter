name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.1
          name: "StudyVault Flutter v1.3.1 (Fix: Gemini 1.5 Flash Endpoint v1 & Multi-Agent)"
          body: |
            ### 📱 StudyVault Flutter v1.3.1 Release APK
            - **Fixed Gemini 404 Endpoint**: Switched to official `v1` endpoint + automatic fallback across `v1`, `v1beta`, and `2.0-flash`
            - **Developed by Gyanchandra**: Prominent developer credits and badges in Settings, Lock Screen, and About Dialog
            - **Multi-AI Agents & Engines**:
              - **Google Gemini** (Gemini 1.5 Flash, Gemini 1.5 Pro, Gemini 2.0 Flash)
              - **OpenAI ChatGPT** (ChatGPT GPT-4o Mini, GPT-4o, GPT-3.5 Turbo)
              - **Anthropic Claude** (Claude 3.5 Sonnet, Claude 3.5 Haiku)
              - **DeepSeek AI** (DeepSeek V3, DeepSeek R1)
            - **Zero UI Flicker**: Instant tab switching and cached reading streak states
            - **Pre-Seeded Core Categories**: CS & IT, Quantitative Aptitude, Reasoning, GK & Current Affairs, English, Hindi Vyakaran
            - **Dedicated Categories Bottom Tab**: Instant search and exam filtering
            - **App Security & 4-Digit PIN Lock**: Keypad lock protecting study materials
            - **Direct PDF Sharing**: Native zero-dependency FileProvider sharing to WhatsApp, Drive, etc.
            - **Native Google Pdfium Indic Rendering Engine**: 100% Hindi/Devanagari text clarity without tofu boxes `□`
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
