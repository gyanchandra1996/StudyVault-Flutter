name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.8.0
          name: "Medhavi (मेधावी) Flutter v1.8.0 - Exam Tools Suite (Pi7 Style), In-App Key Generator, Focus Timer Alarm, Custom PDF & Photo Maker"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v1.8.0 Official Release APK
            - **1. Quiz Creation Workflow & Offline Engine Fallback**: Fixed empty prompt blocking; added instant auto-fallback to offline question bank so quiz creation never fails even with missing key or network downtime.
            - **2. In-App Multi-Provider AI Key Generator**: Interactive key wizard with 1-click browser links to Google AI Studio (100% Free), OpenAI, Claude & DeepSeek, plus in-place key tester.
            - **3. Fixed Flashcard Generator Card Count Overflow**: Resolved layout design break by replacing unconstrained Row with responsive Wrap layout and quick preset chips.
            - **4. Fixed Question Bank Hide/Open Toggles**: Added global `^` toggle on Question Bank header, plus fixed category card expansion overrides.
            - **5. App Exit Confirmation Dialog**: Added Android back button PopScope confirmation preventing accidental app closure.
            - **6. Full-Screen Loading Overlays**: Prominent animated spinners and clear status text during AI quiz, flashcard, and notes generation.
            - **7. Pomodoro Focus Timer & Alarm**: Added audible alarm and haptic vibration feedback on break/focus mode transitions, plus progress bar.
            - **8. Persistent Top Focus Timer Bar**: Live study focus countdown info pill sticky at the top across all screens with 1-tap pause/resume.
            - **9. Dedicated Settings Toggles for AI Tutor & PDF Notes**: Independent switches for AI Tutor / Doubt Solver and AI PDF Notes Generator.
            - **10. Top Tools Tab & Student Utility Suite (Pi7 Style)**:
              - **Passport Size Photo Maker**: Standard 3.5×4.5 cm with Candidate Name & Date of Photo (DOP) stamp for SSC/UPSC, with printable multi-photo sheet generation.
              - **Custom Image Resizer & Compressor**: Target KB limits (e.g. 20-50 KB) and custom width/height in px.
              - **Custom PDF Generator**: Create custom formatted notes with watermarks, candidate info, and margins.
              - **PDF to Image & Image to PDF**: High-speed document and page conversion tools.
            - **11. Brand Identity & App Logo**: Renamed app to genuine Indic brand "Medhavi (मेधावी)" with custom vector book + AI spark logo.
            - **12. Expanded Base Themes & Accents**: Added Nordic Frost, Forest Matcha, and Twilight Warmth themes, plus 8 rich accent colors (Indigo, Emerald, Amethyst, Amber, Crimson, Cyan, Coral, Cobalt).
            - **13. Dashboard Cleanup**: Removed duplicate Backup pill from dashboard quick actions.
            - **14. Study Tab Folder & Import Control**: Added setting to show/hide folder creation and file import buttons for distraction-free reading.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
