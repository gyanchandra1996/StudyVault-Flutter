name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.9.0
          name: "Medhavi (मेधावी) Flutter v1.9.0 - Signature Cleaner, Exam Analytics Heatmap, Syllabus Tracker & Revision Handbook"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v1.9.0 Official Release APK
            - **1. Govt Exam Signature Cleaner & Sharpener**:
              - Whitens paper background to pure white (removes mobile camera shadows and yellow tint).
              - Sharpens blue/black ink strokes with real-time threshold & darkness controls.
              - Compresses strictly to 10–20 KB (SSC, UPSC, IBPS standard) with exact 320×140 px scaling and boundary box.
            - **2. Mock Test Performance Analytics & Heatmap**:
              - Interactive speed vs accuracy heatmap across all past quiz attempts.
              - Subject-wise strength & readiness indicators (Polity, History, Math, Science).
              - Automated weak area detection with 1-tap AI quiz generation for weakest subjects.
            - **3. Interactive Exam Syllabus Tracker**:
              - Built-in comprehensive GS-1 syllabi for UPSC Civil Services, SSC CGL Tier 1, and Banking (IBPS/SBI).
              - Live overall completion percentage bar with local persistent checklist saving.
              - Custom topic & subject addition support for state PCS and other exam aspirants.
            - **4. Exam Revision Handbook & High-Yield Cheat Sheets**:
              - Indian Constitution Articles cheat sheet (Fundamental Rights, DPSP, Writs, Emergency provisions).
              - Modern Indian History Timeline (1857 Revolt to 1947 Independence).
              - Essential Quantitative Aptitude & Mensuration formulas.
              - General Science high-yield facts (vitamins, chemical formulas, SI units).
              - Built-in instant keyword search filtering across all handbook cards.
            - **5. Complete Pi7-Style Student Utility Hub**:
              - Passport size photo maker with DOP stamp & printable 4×6 photo sheets.
              - Custom image resizer & KB compressor (e.g. 20-50 KB).
              - Custom PDF notes generator with candidate details & watermarks.
              - High-speed Image to PDF & PDF to Image converters.
            - **6. Enhanced Multi-Provider AI Engine & Key Generator**:
              - 1-click API key acquisition for Google AI Studio (Free Gemini API), OpenAI, Claude, and DeepSeek.
              - Instant offline quiz fallback so practice never halts during network drops.
            - **7. Focus Timer & Study Habit Suite**:
              - Sticky top study focus timer info pill across all screens.
              - Audio alerts & vibration haptics for break and study intervals.
            - **8. Customization & Distraction-Free Modes**:
              - 7 Base themes & 8 Accent themes.
              - Independent toggles for AI Tutor, AI PDF Notes, and Folder/Import controls.
              - Android back-button exit confirmation dialog.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
