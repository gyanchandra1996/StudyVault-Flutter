name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.5.0
          name: "Medhavi (मेधावी) Flutter v2.5.0 - Full Syllabus Handbook, Gamification Streaks & XP, Aarna Vision Doubt Scanner & Voice Mode"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.5.0 Official Release APK
            - **1. Full Syllabus Built-in Revision Handbook**: Math (Arith/Alg), Hindi & English Grammar, General Science.
            - **2. Gamification Engine**: Streaks 🔥, XP rewards, Level progression & Badges.
            - **3. Snap & Solve AI Doubt Scanner**: Aarna Vision camera doubt resolver.
            - **4. Aarna Voice Mode**: Text-to-speech audio explanations.
            - **5. Enhanced Vault Backup & Restore**: Full SQLite tables, exam reminders & user profile.
            - **1. Brain Games Suite**:
              - Speed Math Blitz (60s mental math rush with streak multipliers).
              - Schulte Grid Focus Trainer (peripheral vision & reading speed).
              - Memory Match Deck (study symbols flip & recall).
              - Stroop Color Reflex (cognitive agility & alertness).
            - **2 & 5. AI Assistant "Aarna" (आर्ना)**:
              - Rebranded to Aarna with personal memory ("About Me") profile.
              - Built-in default offline intelligence engine (always replies even without internet or API key).
              - Link with Google Gemini when enabled in Settings.
            - **3. Multiple Target Exam Reminders**:
              - Swipeable multi-exam countdown carousel on Dashboard.
              - Scheduled local notification alarms & milestone alerts (30d, 15d, 7d, 1d).
            - **4. Camera & Image to PDF**:
              - Multi-snap camera capture, gallery selection, page reordering, rotation & conversion to PDF.
              - Direct 1-tap "Open in PDF Reader" and "Share PDF".
            - **6. Redesigned Quiz Top Bar**:
              - Command Center Hero Card + Quick Action Ribbon + Smooth Category Pill Slider (zero removed items).
            - **7. Flashcards Stored Library & Browser**:
              - 2-Tab deck experience: "Due Review" (SM-2 Spaced Repetition) and "All Stored Flashcards" with live search, filters, edit, delete, and "Review Today" reset.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
