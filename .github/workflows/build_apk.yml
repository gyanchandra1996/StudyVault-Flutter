name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.9.2
          name: "Medhavi (मेधावी) Flutter v2.9.2 - Compact Weekly Chart, Home Reorder, Utility Tools Rename & 12 Brain Games"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.9.2 Official Release APK
            - **1. Compact Weekly Reading Report**: Reduced chart height (`96px`) and header spacing so Primary Study Desk and Weekly Report fit cleanly without crowding Home.
            - **2. Home Screen Layout Order**: Placed **Exam Revision & Handbook** as the final section on Home (`Primary Study Desk` → `Weekly Reading Report` → `Exam & Study Utility` → `Instant Study Actions` → `Recent Notes & Documents` → `Exam Revision & Handbook`).
            - **3. Utility Tools Rename**: Renamed **PDF Tools** cards, settings tile, and tools suite modal header to **Utility Tools**.
            - **4. Expanded Brain Games Hub (12 Games)**: Added **2048 Logic Merge** (4×4 swipe/arrow puzzle with Undo & persisted Best Score) and **Simon Pulse Memory** (4-Pad Classic & 6-Pad Pro progressive sequence trainer).
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
