name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: false

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Standalone Release APK
        run: |
          set -o pipefail
          build_success=false
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt: flutter build apk --release"
            if flutter build apk --release --no-tree-shake-icons 2>&1 | tee build_output.log; then
              build_success=true
              echo "::endgroup::"
              echo "✅ Build succeeded on attempt $attempt"
              break
            fi
            echo "::endgroup::"
            echo "⚠️ Attempt $attempt failed. Waiting 20 seconds before retry..."
            sleep 20
          done
          if [ "$build_success" != "true" ]; then
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Build Output Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Output-Log
          path: build_output.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.8.0
          name: "Medhavi (मेधावी) Flutter v2.8.0 - Smooth Back Navigation, Hierarchy Counts, Master Control & Weekly Line Chart"
          body: |
            ### 📱 Medhavi (मेधावी) Flutter v2.8.0 Official Release APK
            - **1. Smooth Back Navigation (Anti-Flicker)**: Replaced Android snapshotting zoom transition with `_SmoothSlideFadeTransitionsBuilder`, cached themes, scoped `MaterialApp` / `MainScreen` rebuilds, disabled predictive-back window peeking, and removed loading spinner flashes on back navigation.
            - **2. Study Category Hierarchy Counts**: Added recursive subcategory, PDF/file, and question counts across `StudyHubScreen`, `CategoriesScreen`, and `CategoryDetailScreen`.
            - **3. Master Edit & View Control Section**: Added global permission controls (Master Edit/View mode, Edit/Rename, Delete Actions defaulting to OFF, File & Import controls, and Folder & Category controls) with `View Only`, `Safe Edit`, and `Full Admin` presets in Settings, Profile, and quick-access header pills.
            - **4. Interactive Study & Hierarchy Controls**: Added Expand All / Collapse All, interactive `Subcategories: N` toggle pill, nested topic expand/collapse badges, and `+ Subcategory` quick creation.
            - **5. Home Weekly Report Line Chart**: Replaced the weekly bar chart with a smooth gradient-filled line chart with Y-axis scale guides, Today highlight, Daily Avg, and Streak metrics.
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
