name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.0
          name: "StudyVault Flutter v1.4.0 (ID Vault, Hierarchical Folders, Dashboard, List/Grid View & 15Q AI Quiz)"
          body: |
            ### 📱 StudyVault Flutter v1.4.0 Release APK
            - **Top Workspace Tabs & All-in-One Dashboard**: 4 unified workspaces (📊 Dashboard, 📚 Study Material, 📝 Quizzes, 🔒 ID Vault) with streaks, currently reading progress ring, 4-metric quick tiles, and shortcuts
            - **Secure Document & ID Vault**: Offline PIN-protected wallet for Aadhaar Card, PAN Card, Exam Admit Cards, Marksheets, and Certificates with zoomable viewer and native share
            - **Recursive Hierarchical Folders & Subcategories**: Infinite folder nesting (e.g. Computer Science > Data Structures > Trees > PDF) with interactive breadcrumb navigation
            - **Category View Toggle (Grid ⊞ vs List ☰)**: Switch anytime between visual card grid and high-density list with persistent preference
            - **Live PDF & Folder Count Badges**: Real-time counter badge on every subject and subfolder card (e.g. `📄 8 PDFs`)
            - **Categorized Quiz Management**: Assessments organized by subject/category chips with direct Review & 1-Tap Re-attempt
            - **Fixed 15-Question AI Generator Limit**: Token capacity boosted to 8192 tokens with resilient JSON auto-repair for smooth 15+ question generation
            - **Devanagari Hindi (हिंदी) Quiz Generation Verified**: Live tested with Google Gemini 3.5 Flash for complete Devanagari Hindi MCQs and explanations
            - **Zero Data Regression Guarantee**: Non-destructive SQLite v4 migration preserves all existing PDFs, bookmarks, reading logs, and results
            - **Developed by Gyanchandra**: Prominent developer credits and badges in Settings, Lock Screen, and About Dialog
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
