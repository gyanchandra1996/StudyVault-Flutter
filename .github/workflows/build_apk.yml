name: Build Android APK (Flutter)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Standalone Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyVault-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.4.1
          name: "StudyVault Flutter v1.4.1 (Multi-Quiz per Category, In-Category Quizzes, Perfect Tab Alignment & Polished UI)"
          body: |
            ### 📱 StudyVault Flutter v1.4.1 Release APK
            - **Multiple Quizzes per Category**: Create and organize multiple distinct quizzes under any category (e.g. Python 1: Basics, Python 2: OOP under Python)
            - **Category Selector in AI & Manual Quiz Modals**: Directly pick the target category or create a new one on the fly when generating quizzes
            - **In-Category Quizzes Section**: View, start, review, and re-attempt quizzes directly inside any Category Detail screen
            - **Fixed Top Tab Alignment**: Symmetrical 4-workspace TabBar with equal 25% width and centered indicators
            - **Polished Quiz History & Review Cards**: Category badges, score pills, question counters, duration timer, and high-contrast Re-attempt button
            - **Devanagari Hindi & 15Q AI Quiz Support**: Token capacity up to 8192 tokens with resilient JSON auto-repair
            - **Devanagari Hindi (हिंदी) Quiz Generation Verified**: Live tested with Google Gemini 3.5 Flash for complete Devanagari Hindi MCQs and explanations
            - **Zero Data Regression Guarantee**: Non-destructive SQLite v4 migration preserves all existing PDFs, bookmarks, reading logs, and results
            - **Developed by Gyanchandra**: Prominent developer credits and badges in Settings, Lock Screen, and About Dialog
          files: build/app/outputs/flutter-apk/app-release.apk
          overwrite: true
