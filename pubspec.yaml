name: study_vault_flutter
description: "Medhavi (मेधावी) - Offline Indic Exam & Study Companion with AI Quiz, PDF Tools & Safe Mode"
publish_to: "none"
version: 2.3.0+20

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  file_picker: ^8.0.0+1
  syncfusion_flutter_pdfviewer: any
  syncfusion_flutter_pdf: any
  google_fonts: ^6.2.1
  http: ^1.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  open_file: ^3.3.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
